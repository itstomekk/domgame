<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOMGAME</title>
<style>
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% 30%,#1b2a44,#0b1120 70%);color:#f6efe0;font:16px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8vh 16px;box-sizing:border-box}
h1{font:500 clamp(2.4rem,9vw,5rem) Georgia,serif;letter-spacing:.06em;margin:0}
p{opacity:.75;margin:.6em 0 2.2em;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,320px));gap:20px;justify-content:center;width:100%;max-width:1000px}
a.card,div.card{display:block;border-radius:14px;overflow:hidden;background:rgba(246,239,224,.08);border:1px solid rgba(246,239,224,.25);color:inherit;text-decoration:none}
a.card:hover{border-color:#e8a33d}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.card b{display:block;padding:14px 16px 2px;font-size:1.2rem}
.card span{display:block;padding:0 16px 16px;opacity:.7;font-size:.9rem}
.soon{display:flex;align-items:center;justify-content:center;min-height:200px;opacity:.5;border-style:dashed!important}
footer{margin-top:auto;padding-top:6vh;opacity:.6;font-size:.85rem}footer a{color:#e8a33d}
