<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RENIKDOM: spacer 3D po mieszkaniu, z misjami i zdjęciami 360°.">
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>RENIKDOM IFC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: the 3D scene is the page; a thin drawing-sheet style title block and controls float over it. Single look by choice. */
:root{
  --ink:#1d2420; --paper:#f3f1ea; --panel:rgba(243,241,234,.92); --line:rgba(29,36,32,.22);
  --green:#3f5a45; --oak:#b58a5a; --wine:#7a2e3a; --hover:#dfe6dd;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
#app.dark{--ink:#ece8dd; --paper:#14181a; --panel:rgba(20,24,26,.9); --line:rgba(236,232,221,.26); --green:#86b892; --wine:#e08a96; --hover:#2a3330; color-scheme:dark}
#app.dark #credit a{color:var(--green)}
#app{color:var(--ink)}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;width:100%}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.block{position:absolute;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px)}
#title{left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:10px 14px;max-width:min(300px,calc(100% - 32px))}
#title h1{font-family:var(--display);font-size:1.25rem;font-weight:500;margin:0;line-height:1.1}
#title p{margin:4px 0 0;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
#rooms{background:transparent;border:0;backdrop-filter:none;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:fit-content;max-width:calc(100% - 32px)}
button{font:500 .78rem var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);padding:6px 9px;cursor:pointer;border-radius:2px}
#rooms button,#photo button{background:var(--panel)}
#rooms button[aria-pressed="true"]{background:var(--green);color:var(--paper)}
button:hover,#rooms button:hover{background:var(--hover)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button[aria-pressed="true"]{background:var(--green);color:var(--paper);border-color:var(--green)}
#credit{font-size:.75rem;opacity:.8;margin-left:6px}#credit a{color:var(--green);font-weight:500}
.sep{width:1px;align-self:stretch;background:var(--line);margin-inline:4px}
#map{right:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:6px;line-height:0}
#map canvas{width:150px;height:238px;cursor:crosshair}
#help{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:8px 12px;font-size:.72rem;max-width:200px;line-height:1.4}
#pad{right:16px;top:calc(190px + env(safe-area-inset-top,0px));padding:6px;display:none;gap:6px;flex-direction:column}
#pad button{width:52px;height:44px;font-size:1.1rem}
#plans{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column}
#plans .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
#plans .bar b{font:500 1rem var(--display);margin-right:auto}
#plans .sheet{flex:1;min-height:0;overflow:auto;text-align:center;padding:12px 16px}
#plans img{max-width:100%;max-height:100%;cursor:zoom-in}
#plans img.zoom{max-width:none;max-height:none;cursor:zoom-out}
#quest{display:flex;align-items:center;gap:8px;margin-top:8px}
#quest svg{width:30px;height:30px;transform:rotate(-90deg)}
#quest circle{fill:none;stroke-width:4}
#qbg{stroke:var(--line)} #qfg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
#qnum{font:500 1.05rem var(--display);font-variant-numeric:tabular-nums;min-width:3.2em}
#qnum.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:var(--wine)}100%{transform:scale(1)}}
#qlist{margin:8px 0 0;padding:0;list-style:none;font-size:.78rem;line-height:1.5;max-height:46vh;overflow:auto}
#qlist li{display:flex;gap:6px;opacity:.75} #qlist li.ok{opacity:1;color:var(--green);font-weight:500}
#qlist li::before{content:"○"} #qlist li.ok::before{content:"●"}
#qlist h3{font:500 .7rem var(--body);letter-spacing:.06em;text-transform:uppercase;margin:8px 0 2px;opacity:.6}
#toast{left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);padding:9px 16px;font-weight:500;font-size:.875rem;transition:transform .35s ease;max-width:calc(100% - 32px);border-color:var(--green);z-index:5}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#qnum.bump{animation:none}#toast,#qfg{transition:none}}
#c.glitch{animation:glitch .18s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0,0) skewX(0);filter:none}25%{transform:translate(-8px,3px) skewX(4deg);filter:hue-rotate(90deg) saturate(3)}50%{transform:translate(6px,-4px) skewX(-6deg);filter:invert(1)}75%{transform:translate(-3px,5px);filter:hue-rotate(220deg) contrast(2)}100%{transform:none;filter:none}}
#boom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:500 clamp(1.4rem,5vw,3.2rem) var(--display);color:#fff;text-shadow:3px 0 #f0f,-3px 0 #0ff,0 0 18px #000;text-align:center;padding:16px;z-index:6}
#intro{position:absolute;inset:0;z-index:50;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1b2a44 0%,#0b1120 70%);color:#f6efe0;font-family:var(--body);transition:opacity .7s ease,transform .7s ease}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
#intro .plan{display:none}
#intro button{font:600 1rem var(--body);cursor:pointer;border-radius:999px;border:1px solid rgba(255,255,255,.4);color:#f6efe0;background:rgba(255,255,255,.08);padding:10px 20px}
@keyframes inPulse{50%{transform:scale(1.07);box-shadow:0 0 0 14px rgba(232,163,61,0)}0%{box-shadow:0 0 0 0 rgba(232,163,61,.5)}}
#intro .stage{position:absolute;inset:0;display:none}
#intro.play .stage{display:block}
#introSkip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:3;font-size:.8rem!important;padding:6px 14px!important}
/* background plans: 4 pre-tinted sheets crossfade slowly (one always visible), soft drift; the whole stack follows the mouse a little (JS, one transform) */
#intro .plans{position:absolute;inset:-4%;will-change:transform}
#intro .plans i{position:absolute;inset:0;background:center/contain no-repeat;opacity:0;will-change:opacity,transform;animation:inPlans 96s linear infinite}
@keyframes inPlans{0%{opacity:0;transform:scale(1.04) rotate(var(--r))}8%{opacity:.26}25%{opacity:.26}33%,100%{opacity:0;transform:scale(1) rotate(0deg)}}
#intro .grid{position:absolute;inset:0;background:linear-gradient(rgba(120,170,255,.05) 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,rgba(120,170,255,.05) 1px,transparent 1px) 0 0/44px 100%;animation:inGrid 140s linear infinite}
@keyframes inGrid{to{background-position:0 88px,132px 0}}
#intro .scan{position:absolute;top:0;bottom:0;left:0;width:120px;background:linear-gradient(90deg,transparent,rgba(120,200,255,.1) 90%,rgba(190,235,255,.42));transform:translateX(-130px);animation:inScan 11s linear infinite}
@keyframes inScan{to{transform:translateX(100vw)}}
#intro .scan,#intro .flash{display:none}
#intro .burst{position:absolute;right:calc(3vw - 22vh);bottom:calc(3vh + 84px - 14vh);width:min(100vh,190vw);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(rgba(232,163,61,.2) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);opacity:0;animation:inBurst 9s linear 1.7s forwards,inSpin 180s linear 10.7s infinite}
@keyframes inSpin{from{transform:rotate(200deg)}to{transform:rotate(560deg)}}
@keyframes inBurst{0%{opacity:0;transform:rotate(160deg) scale(.8)}30%{opacity:.4}100%{opacity:.4;transform:rotate(200deg) scale(1)}}
#intro .bk{position:absolute;top:-40px;height:16px;border-radius:3px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);opacity:0;animation:inBrick 9s cubic-bezier(.3,0,.8,.6) infinite;animation-duration:28s!important;z-index:1}
#intro .bk:before{content:"";position:absolute;top:-5px;left:3px;right:3px;height:5px;background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 12px)}
@keyframes inBrick{0%{opacity:.6;transform:translateY(0) rotate(0)}100%{opacity:.6;transform:translateY(108vh) rotate(calc(var(--r)*.3))}}
#intro .hello,#intro .facts,#intro .cards{z-index:2}#intro .fig{z-index:1}#introM2{font-style:normal}
#c.kickshake{animation:kShake .45s linear}
@keyframes kShake{10%{transform:translate(-14px,8px) rotate(-.8deg)}25%{transform:translate(12px,-10px) rotate(.7deg)}40%{transform:translate(-9px,-6px)}55%{transform:translate(8px,7px) rotate(-.4deg)}70%{transform:translate(-5px,3px)}85%{transform:translate(3px,-2px)}}
#c.roarshake{animation:kShake .3s linear 7}
#rageVig{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(150,0,0,.6) 100%)}
#rageVig.on{animation:rageV 3.2s ease-out}
@keyframes rageV{0%{opacity:0}8%{opacity:1}25%{opacity:.6}35%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#c.kickshake,#c.roarshake{animation:none}}
#introGo{position:absolute;right:calc(3vw + min(72vh,150vw)*.5);bottom:calc(3vh + 18vh);transform:scale(0);transform-origin:100% 50%;white-space:nowrap;z-index:4;background:#e8a33d!important;color:#1a1206!important;border:0!important;font-size:1.25rem!important;padding:16px 34px!important;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:inGo 1s cubic-bezier(.25,1.2,.4,1) 4.5s forwards,inGoPulse 3.2s ease-in-out 5.5s infinite}
@keyframes inGo{to{transform:scale(1)}}
@keyframes inGoPulse{50%{box-shadow:0 0 0 16px rgba(232,163,61,0),0 10px 30px rgba(0,0,0,.5)}0%{box-shadow:0 0 0 0 rgba(232,163,61,.55),0 10px 30px rgba(0,0,0,.5)}}
#intro .hello{position:absolute;left:6vw;top:12vh;width:min(60vw,760px)}
#intro .l1{font:500 clamp(1.4rem,4.2vw,3rem)/1.1 var(--display);display:block}
#intro .l1 i{display:inline-block;font-style:normal;opacity:0;animation:inLetter 1.2s cubic-bezier(.25,1,.4,1) forwards}
@keyframes inLetter{from{opacity:0;transform:translate(calc(var(--dx)*.25),calc(var(--dy)*.25)) scale(1.15);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
#intro .l2{display:block;font:500 clamp(3.4rem,13vw,10rem)/.95 var(--display);color:#e8a33d;opacity:0;transform-origin:left center;animation:inSlam 1.6s cubic-bezier(.25,1,.4,1) 1.25s forwards;text-shadow:0 6px 0 #7a2e3a}
@keyframes inSlam{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:none}}
#intro .sig{display:inline-block;font:italic 500 clamp(1.6rem,5vw,3.4rem) var(--display);margin-top:.2em;clip-path:inset(0 100% 0 0);animation:inSig 1.8s ease-out 2.3s forwards;border-bottom:3px solid #e8a33d;padding:0 .3em .05em 0}
@keyframes inSig{to{clip-path:inset(0 0 0 0)}}
#intro .fig{position:absolute;right:3vw;bottom:calc(3vh + 6px);height:min(72vh,150vw);transform:translateY(120%);animation:inFig 1.6s cubic-bezier(.25,1,.4,1) 1.7s forwards,inWave 2.8s ease-in-out 3.4s 4 alternate;transform-origin:50% 100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
@keyframes inFig{to{transform:none}}
@keyframes inWave{from{rotate:-3deg}to{rotate:3deg}}
#intro .facts{position:absolute;left:6vw;top:calc(12vh + clamp(11rem,24vw,16.5rem));display:flex;flex-wrap:wrap;gap:10px;width:min(58vw,700px)}
#intro .facts span{padding:8px 14px;border-radius:10px;background:rgba(246,239,224,.12);border:1px solid rgba(246,239,224,.3);backdrop-filter:blur(4px);font-weight:500;font-size:clamp(.8rem,1.6vw,1.05rem);opacity:0;animation:inFact 1.3s cubic-bezier(.25,1,.4,1) forwards}
#intro .facts b{color:#e8a33d;font-size:1.25em}
@keyframes inFact{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#intro .cards{position:absolute;left:6vw;bottom:calc(3vh + 100px);display:flex}
#intro .cards img{width:clamp(90px,13vw,170px);aspect-ratio:3/2;object-fit:cover;border:5px solid #f6efe0;border-radius:3px;box-shadow:0 10px 26px rgba(0,0,0,.55);margin-right:-3vw;opacity:0;animation:inCard 1.5s cubic-bezier(.25,1,.4,1) forwards;max-width:none}
@keyframes inCard{from{opacity:0;transform:translate(-8vw,6vh) rotate(-8deg)}to{opacity:1;transform:rotate(var(--r))}}
#intro .rail{position:absolute;left:0;right:0;bottom:3vh;z-index:2;height:4px;background:repeating-linear-gradient(90deg,#8a6a45 0 10px,transparent 10px 24px);border-top:3px solid #c9c9c9}
#intro .train{position:absolute;bottom:calc(3vh + 10px);left:0;display:flex;align-items:flex-end;gap:5px;transform:translateX(-110vw);z-index:3;will-change:transform}
#intro .train u{display:block;position:relative;width:clamp(52px,6vw,90px);height:clamp(28px,3.2vw,44px);border-radius:4px;background:linear-gradient(#0000 22%,rgba(255,255,255,.85) 22% 50%,#0000 50%) 12%/76% 100% no-repeat,var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);animation:inChug .8s ease-in-out infinite alternate paused;text-decoration:none}
#intro .train.go u{animation-play-state:running}
#intro .train u:before{content:"";position:absolute;top:-7px;left:8px;right:8px;height:7px;background:repeating-linear-gradient(90deg,var(--c) 0 13px,transparent 13px 20px)}
#intro .train u:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:14px;background:radial-gradient(circle at 20% 50%,#111 6.5px,transparent 7.5px),radial-gradient(circle at 80% 50%,#111 6.5px,transparent 7.5px)}
#intro .train u.loco{height:clamp(38px,4.4vw,60px);width:clamp(64px,7.6vw,106px);border-radius:4px 14px 4px 4px;background:linear-gradient(#0000 16%,rgba(255,255,255,.85) 16% 46%,#0000 46%) 14%/34% 100% no-repeat,var(--c)}
#intro .train s{position:absolute;right:14%;top:-18px;width:18px;height:18px;border-radius:50%;background:rgba(240,240,240,.6);animation:inPuff 4.2s ease-out infinite;text-decoration:none}
#intro .train.go s{animation-duration:2.4s}
#intro .train s:nth-child(2){animation-delay:1.4s}#intro .train s:nth-child(3){animation-delay:2.8s}
@keyframes inPuff{from{transform:translate(0,0) scale(.5);opacity:.9}to{transform:translate(-70px,-90px) scale(3.2);opacity:0}}
@keyframes inChug{to{translate:0 -2px}}
#introSnd{position:absolute;right:16px;bottom:calc(3vh + 96px);font-size:.8rem;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.45);animation:inBlink 2.6s ease-in-out infinite alternate;z-index:3}
@keyframes inBlink{to{opacity:.35}}
#intro .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:inFlash .5s ease-out 1.25s}
@keyframes inFlash{0%{opacity:.75}100%{opacity:0}}
@media (max-width:700px){#intro .fig{height:42vh;right:-4vw;bottom:calc(3vh + 6px)}#introGo{right:calc(-4vw + 42vh*.4);bottom:calc(3vh + 70px)}#intro .hello,#intro .facts{width:88vw}#intro .cards{bottom:12vh}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
@media (prefers-reduced-motion:reduce){#c.glitch{animation:none}}
#photo{position:absolute;inset:0;background:#111;display:flex;align-items:center;justify-content:center}
#photo img{max-width:100%;max-height:100%;object-fit:contain}
#photo .cap{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:8px 12px;font-size:.8125rem}
#photo button{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel)}
@media (max-width:700px){
  #rooms{max-width:calc(100% - 32px)}
  #help{display:none} #pad{display:flex}
  #map canvas{width:96px;height:152px}
  #title h1{font-size:1.05rem}
}
</style>

<div id="app">
  <canvas id="c" aria-label="Model 3D mieszkania"></canvas>
  <div id="title" class="block">
    <h1>RENIKDOM <small style="font-size:.45em;opacity:.7">wg IFC</small></h1>
    <p id="where" hidden>Salon</p>
    <div id="quest"><svg viewBox="0 0 36 36" aria-hidden="true"><circle id="qbg" cx="18" cy="18" r="15"></circle><circle id="qfg" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"></circle></svg><span id="qnum">0/24</span><button id="qbtn" aria-expanded="false">Misje</button></div>
    <ul id="qlist" hidden></ul>
  </div>
  <div id="map" class="block"><canvas id="mm" width="300" height="476" aria-label="Rzut mieszkania. Kliknij, aby się tam przenieść."></canvas></div>
  <div id="pad" class="block">
    <button id="fwd" aria-label="Idź do przodu">&#9650;</button>
    <button id="back" aria-label="Idź do tyłu">&#9660;</button>
    <button id="jump" aria-label="Skocz">&#8679;</button>
  </div>
  <div id="rooms" class="block">
    <button id="doll" aria-pressed="false">Makieta</button>
    <button id="real" hidden>Widok realistyczny</button>
    <button id="pano" hidden aria-pressed="false">Zdjęcie 360°</button>
    <button id="render" hidden aria-pressed="false">Renderuj</button>
    <span class="sep"></span>
    <button id="wallbtn">Ściany: gołębie</button>
    <button id="qualbtn">Jakość: pełna</button>
    <button id="plansbtn">Rzuty</button>
    <button id="citybtn" aria-pressed="true">Okolica: wł.</button>
    <button id="music" aria-pressed="false">Muzyka: włączy się po kliknięciu</button>
    <span id="credit">made by <a href="https://x.com/itstomekk" target="_blank" rel="noopener">TomekK</a></span>
  </div>
  <div id="toast" class="block" role="status" aria-live="polite"></div>
  <button id="climbBtn" hidden onclick="useLadder()" style="position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:6;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(20,20,20,.72);color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer">Wejdź po drabince (E)</button>
  <div id="intro" role="dialog" aria-label="Powitanie">
    <div class="plan"></div>
    <div class="stage" id="introStage" aria-hidden="true"></div>
    <button id="introGo">odwiedź moją chatę &#9654;</button>
  </div>
  <div id="boom" hidden></div>
  <div id="help" hidden></div>
  <div id="plans" hidden>
    <div class="bar"><b id="plancap"></b><button id="planprev">Poprzedni</button><button id="plannext">Następny</button><button id="planclose">Wróć do modelu</button></div>
    <div class="sheet"><img id="planimg" alt=""></div>
  </div>
  <div id="photo" hidden>
    <img id="photoimg" alt="">
    <div class="cap block" id="photocap"></div>
    <button id="photoclose">Wróć do modelu</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(function(){
/* Geometry is given in pixels of the 1:50 wall-layout sheet rendered at 110 dpi (87.2 px = 1 m). */
var S=87.2, OX=150, OY=150;
function X(p){return (p-OX)/S} function Z(p){return (p-OY)/S}
var H0=2.23, SLOPE=0.401, HMAX=99, KX=(HMAX-H0)/SLOPE;
function ceilH(x){return Math.min(H0+SLOPE*Math.max(x,0),HMAX)}
/* url switch: ?bez-papierosow (także #bez-papierosow, ?nosmoking) - chata bez popielniczki, paczki i misji sprzątania fajek */
var NO_SMOKE=(function(){var s=(location.search||'')+'&'+(location.hash||'');return /[?#&]bp(=|&|#|$)/.test(s)||/bez[-_ ]?papieros|bez[-_ ]?tyton|no[-_ ]?smok|nosmok|antysmok/i.test(s)})();window.__noSmoke=NO_SMOKE;
